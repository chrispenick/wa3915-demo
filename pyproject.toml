[project]
name = "wa3915-demos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a]>=2.0.0",
    "litellm>=1.0,!=1.82.7,!=1.82.8",
    "pydantic>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["m1_anatomy","m2_structured","m3_tools","m4_callbacks","m5_workflow","m7_testing","m8_deploy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["m7_testing"]
